<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黒板</title>
<style>
  :root { --bar:#f2f2f2; --line:#cfcfcf; --fg:#222; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:system-ui,sans-serif; color:var(--fg); }
  #bar { position:fixed; top:0; left:0; right:0; min-height:40px; background:var(--bar); border-bottom:1px solid var(--line);
         display:flex; align-items:center; gap:5px; padding:4px 8px; box-sizing:border-box; user-select:none; z-index:10; flex-wrap:wrap; overflow:hidden; row-gap:4px; }
  #bar button { height:28px; padding:0 8px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; font-size:13px; white-space:nowrap; }
  #bar button.sel { outline:2px solid #3b82f6; }
  .sw { width:28px; padding:0 !important; }
  .sw span { display:block; width:18px; height:18px; margin:auto; border-radius:50%; border:1px solid rgba(0,0,0,.35); box-sizing:border-box; }
  #bar .sep { width:1px; height:22px; background:var(--line); margin:0 2px; flex:none; }
  #bar label { font-size:12px; display:flex; align-items:center; gap:3px; white-space:nowrap; }
  #bar input[type=range] { width:70px; }
  #bar select { height:28px; max-width:150px; font-size:13px; }
  .pop { display:none; position:fixed; background:#fff; border:1px solid var(--line); border-radius:4px;
               box-shadow:0 2px 8px rgba(0,0,0,.15); padding:4px; z-index:20; min-width:160px; }
  .pop.open { display:block; }
  .pop button { display:block; width:100%; text-align:left; border:none; background:none; height:30px; padding:0 10px; }
  .pop button:hover { background:#eee; }
  #bmenu-pop #bdel { color:#b00; }
  #c { position:fixed; top:40px; left:0; touch-action:none; cursor:crosshair; }
  #c.pen, #c.erase { cursor:none; }
  #c.pan { cursor:grab; }
  #cursor { position:fixed; width:28px; height:28px; pointer-events:none; z-index:5; display:none;
            background-repeat:no-repeat; background-size:28px 28px; }
  #cursor.pen { display:block; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><g transform='rotate(45 14 14)'><rect x='11' y='2' width='6' height='16' rx='1' fill='%23f2b134' stroke='%23000' stroke-width='1'/><rect x='11' y='2' width='6' height='3' fill='%23e05a5a' stroke='%23000' stroke-width='1'/><path d='M11 18 L14 25 L17 18 Z' fill='%23f5deb3' stroke='%23000' stroke-width='1'/><path d='M13 22.5 L14 25 L15 22.5 Z' fill='%23000'/></g></svg>"); }
  #cursor.erase { display:block; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 28 28'><g transform='rotate(-30 14 14)'><rect x='4' y='8' width='20' height='12' rx='2' fill='%23fff' stroke='%23000' stroke-width='1.2'/><rect x='4' y='8' width='8' height='12' rx='2' fill='%234a90e2' stroke='%23000' stroke-width='1.2'/></g><circle cx='14' cy='14' r='1.5' fill='%23000'/></svg>"); }
  #foot { position:fixed; left:0; right:0; bottom:0; height:20px; background:var(--bar); border-top:1px solid var(--line);
          font-size:11px; color:#777; display:flex; align-items:center; gap:14px; padding:0 10px; box-sizing:border-box; user-select:none; white-space:nowrap; overflow:hidden; }
  #foot a { color:#777; }
  #zoom { flex:none; }
  #status { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; }
  #hint { flex:none; color:#999; }
  #credit { flex:none; }
  body.fs #foot { display:none; }
  @media (max-width: 1100px) { #hint { display:none; } }
</style>
</head>
<body>
<div id="bar">
  <button class="sw" data-color="#000000" title="黒/白 (1)"><span></span></button>
  <button class="sw" data-color="#e8502a" title="赤 (2)"><span></span></button>
  <button class="sw" data-color="#f0c020" title="黄 (3)"><span></span></button>
  <button class="sw" data-color="#0050d0" title="青 (4)"><span></span></button>
  <button id="eraser" title="消しゴム (E): 触れた線を消す。ペンの側面ボタンを押しながら描いても消せる">消しゴム</button>
  <button id="hand" title="移動 (H) / Space+ドラッグ / 中ボタン / 右ドラッグ。画像の上でドラッグすると画像を移動、四隅のハンドルで拡大縮小、Delete で削除">移動</button>
  <span class="sep"></span>
  <label>太さ <input id="width" type="range" min="1" max="30" value="3"><span id="wv">3</span></label>
  <span class="sep"></span>
  <button id="undo" title="元に戻す (Ctrl+Z)">←</button>
  <button id="redo" title="やり直し (Ctrl+Y)">→</button>
  <button id="clear">全消去</button>
  <span class="sep"></span>
  <button id="home" title="原点へ戻り倍率 100% (0)">原点</button>
  <button id="fit" title="全体を表示 (F)">全体</button>
  <span class="sep"></span>
  <button id="smenu" title="保存形式を選ぶ">保存 ▾</button>
  <button id="loadj" title="JSON を新しいボードとして読み込む">JSON 読込</button>
  <input id="file" type="file" accept=".json" style="display:none">
  <span class="sep"></span>
  <label><select id="boardsel" title="ボードの切替"></select></label>
  <button id="bnew" title="新しいボードを追加">＋</button>
  <button id="bmenu" title="ボードの操作(名前変更・削除)">▾</button>
  <span class="sep"></span>
  <label title="チェックすると白い背景(ホワイトボード)、外すと黒板"><input id="white" type="checkbox"> 白板</label>
</div>
<div id="bmenu-pop" class="pop">
  <button id="brename">名前を変更…</button>
  <button id="bdel">このボードを削除…</button>
</div>
<div id="smenu-pop" class="pop">
  <button id="save">PNG 画像</button>
  <button id="savesvg">SVG 画像(ベクトル)</button>
  <button id="savej">JSON(編集用データ)</button>
</div>
<canvas id="c"></canvas>
<div id="cursor"></div>
<div id="foot">
  <span id="zoom">100%</span>
  <span id="status"></span>
  <span id="hint">ホイール: ズーム  Space/中/右ドラッグ: 移動  1/2/3/4: 色  E / ペン側面ボタン: 消しゴム  H: 移動  Ctrl+V: 画像貼付  Ctrl+Z/Y</span>
  <span id="credit">MIT License, &copy; 2026 Kouta Sekine · <a href="https://sapp.jp" target="_blank" rel="noopener">S Apps</a></span>
</div>
<script>
(() => {
  const c = document.getElementById('c'); let ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  // 状態
  let strokes = [];            // {color, width, pts:[{x,y,p}]}  (ワールド座標)
  let images = [];             // {src(dataURL), x, y, w, h, img(HTMLImageElement, 実行時のみ)}
  let selImg = null;           // 選択中の画像(移動ツールでクリック)
  let lastPtr = null;          // 直近のポインタ位置(画面座標)。貼り付け位置に使う
  let undoStack = [], redoStack = [];   // 操作 {type:'add'|'del'|'clear', ...}
  let color = '#000000', width = 3, tool = 'pen';   // pen | eraser | hand
  let view = { x:0, y:0, s:1 };        // 画面 = ワールド*s + (x,y)  (CSS px)
  let dark = true;             // 既定は黒板モード
  let cur = null;              // 描画中ストローク
  let pointers = new Map();    // アクティブポインタ (タッチ2本操作用)
  let panState = null, spaceDown = false;
  let W = 0, H = 0;

  const bg = () => dark ? '#2f5a3c' : '#ffffff';
  // 色はデータ上の 4 種(キー)で保存し、表示色を黒板/白板で切り替える。
  // 表示色は色覚多様性(P 型・D 型)を考慮して、背景とのコントラストと色同士の輝度差を確保した値
  const PALETTE = [
    { key:'#000000', chalk:'#f2f2f2', white:'#000000' },   // 黒(黒板では白)
    { key:'#e8502a', chalk:'#ff7046', white:'#d42040' },   // 赤(黒板では明るい朱赤 — eye チョークに倣う、白板では深紅)
    { key:'#f0c020', chalk:'#f8e070', white:'#d08a00' },   // 黄(黒板では明るく淡い黄 — 朱赤と輝度差をつける、白板では金)
    { key:'#0050d0', chalk:'#5aa9ff', white:'#0066cc' },   // 青(黒板では明るい青)
  ];
  const LEGACY = { '#d00000':'#e8502a' };   // 旧版のデータ色
  function strokeColor(col) {
    const k = LEGACY[col] || col; const pal = PALETTE.find(p => p.key === k);
    if (pal) return dark ? pal.chalk : pal.white;
    return /^#[0-9a-f]{6}$/i.test(String(col)) ? col : PALETTE[0][dark ? 'chalk' : 'white'];   // 不正な値は既定色
  }
  function updateSwatches() { document.querySelectorAll('.sw').forEach(b => { b.firstElementChild.style.background = strokeColor(b.dataset.color); }); }

  function resize() {
    // 全画面(F11 や全画面 API)のときはフッタを隠して描画領域を広げる
    const fs = !!document.fullscreenElement || (window.innerHeight >= screen.height && window.innerWidth >= screen.width);
    document.body.classList.toggle('fs', fs);
    const bh = document.getElementById('bar').offsetHeight; c.style.top = bh + 'px';
    const fh = fs ? 0 : document.getElementById('foot').offsetHeight;
    W = window.innerWidth; H = window.innerHeight - bh - fh;
    c.style.width = W+'px'; c.style.height = H+'px';
    c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
    redraw();
  }
  window.addEventListener('resize', resize);
  document.addEventListener('fullscreenchange', resize);

  const toWorld = (sx,sy) => ({ x:(sx - view.x)/view.s, y:(sy - view.y)/view.s });

  function drawStroke(st) {
    const pts = st.pts; if (!pts.length) return;
    ctx.strokeStyle = strokeColor(st.color);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (pts.length === 1) {
      ctx.beginPath(); ctx.lineWidth = st.width*pw(pts[0].p);
      ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[0].x+0.01, pts[0].y); ctx.stroke(); return;
    }
    for (let i=1;i<pts.length;i++) {
      ctx.beginPath(); ctx.lineWidth = st.width*pw(pts[i].p);
      ctx.moveTo(pts[i-1].x, pts[i-1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
    }
  }
  function drawImage(im) {
    if (!im.img) { const i = new Image(); i.onload = () => redraw(); i.src = im.src; im.img = i; }
    if (im.img.complete && im.img.naturalWidth) ctx.drawImage(im.img, im.x, im.y, im.w, im.h);
  }
  const HANDLE = 12;   // ハンドルの大きさ(画面 px)
  const corners = m => [[m.x,m.y],[m.x+m.w,m.y],[m.x,m.y+m.h],[m.x+m.w,m.y+m.h]];   // 0:左上 1:右上 2:左下 3:右下
  function handleAt(m, wx, wy) {   // 選択中画像の四隅ハンドルに当たっていればその番号
    if (!m) return -1; const r = (HANDLE/2 + 3)/view.s;
    const cs = corners(m); for (let i=0;i<4;i++) if (Math.abs(wx-cs[i][0])<=r && Math.abs(wy-cs[i][1])<=r) return i; return -1;
  }
  function imageAt(wx, wy) { for (let i=images.length-1;i>=0;i--) { const m=images[i]; if (wx>=m.x && wx<=m.x+m.w && wy>=m.y && wy<=m.y+m.h) return m; } return null; }
  function pw(p) { return (p === undefined || p === 0 || p === 0.5) ? 1 : 0.4 + 1.2*p; }

  function applyView() { ctx.setTransform(dpr*view.s, 0, 0, dpr*view.s, dpr*view.x, dpr*view.y); }

  function redraw() {
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = bg(); ctx.fillRect(0,0,c.width,c.height);
    drawGrid();
    applyView();
    for (const im of images) drawImage(im);
    const erasing = (cur && cur.type==='del') ? cur.set : null;
    for (const st of strokes) if (!erasing || !erasing.has(st)) drawStroke(st);
    if (cur && cur.pts) drawStroke(cur);
    if (selImg && images.includes(selImg)) {
      ctx.strokeStyle='#3b82f6'; ctx.lineWidth=2/view.s; ctx.setLineDash([6/view.s,4/view.s]);
      ctx.strokeRect(selImg.x, selImg.y, selImg.w, selImg.h); ctx.setLineDash([]);
      const hs = HANDLE/view.s; ctx.fillStyle='#fff'; ctx.lineWidth=1.5/view.s;
      for (const [hx,hy] of corners(selImg)) { ctx.beginPath(); ctx.rect(hx-hs/2, hy-hs/2, hs, hs); ctx.fill(); ctx.stroke(); }
    }
    document.getElementById('zoom').textContent = Math.round(view.s*100)+'%';
  }
  function drawGrid() {   // 薄い点グリッド(位置感覚用)
    let g = 50*view.s; if (!(g > 0) || !isFinite(g)) return;
    while (g < 25) g *= 2; while (g > 100) g /= 2;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = dark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';
    const x0 = ((view.x % g) + g) % g, y0 = ((view.y % g) + g) % g;
    for (let x=x0; x<W; x+=g) for (let y=y0; y<H; y+=g) ctx.fillRect(x-0.75, y-0.75, 1.5, 1.5);
  }

  // ---- 複数ボード + 自動保存(このブラウザ内に保持。開き直すと復元) ----
  // 索引: INDEX = {boards:[{id,name}], current:id}   各ボード: DATA(id) = {v, dark, view, strokes, images, t}
  const INDEX = 'whiteboard.boards.v2', DATA = id => 'whiteboard.board.v2.' + id, OLDKEY = 'whiteboard.autosave.v1';
  let boards = [], curId = null;
  let saveTimer = null, saveFailed = false;
  const storageOK = (() => { try { const k='whiteboard.__probe'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })();
  const isQuota = e => e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014);
  const storageMsg = e => !storageOK ? 'この環境ではブラウザ内に保存できません(プライベートモード等)。JSON 保存で退避してください'
    : isQuota(e) ? '自動保存に失敗(容量超過)。JSON 保存で退避し、不要なボードを削除してください' : '自動保存に失敗: ' + (e && e.message || e);
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  function saveIndex() { localStorage.setItem(INDEX, JSON.stringify({ boards, current: curId })); }
  function snapshot() { return { v:2, dark, view, strokes, images: images.map(stripImg), t:Date.now() }; }
  function saveNow() {
    clearTimeout(saveTimer); saveTimer = null;
    if (!curId) return;
    try { localStorage.setItem(DATA(curId), JSON.stringify(snapshot())); saveIndex(); saveFailed = false; setStatus('自動保存 ' + new Date().toLocaleTimeString()); return true; }
    catch (e) { saveFailed = true; setStatus(storageMsg(e)); return false; }
  }
  // 未保存の変更が失われる操作の前に確認
  function confirmUnsaved() {
    if (!curId) return true;
    if (saveNow()) return true;
    return confirm('このボードの変更はブラウザ内に保存できていません。このまま続けると変更が失われます。続けますか?(キャンセルして JSON 保存で退避できます)');
  }
  function autosave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
  window.addEventListener('pagehide', () => { if (saveTimer) saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) saveNow(); });
  // ---- データの検証・正規化(保存データ・JSON 読込の両方に適用) ----
  const num = (v, def=0) => (typeof v === 'number' && isFinite(v)) ? v : def;
  const SAFE_SRC = /^data:image\/(png|jpeg|jpg|gif|webp|bmp);base64,[A-Za-z0-9+/=\s]+$/;
  function sanitize(d) {
    const out = { strokes:[], images:[], dark:true, view:{x:0,y:0,s:1}, dropped:0 };
    if (!d || typeof d !== 'object') return out;
    out.dark = !!d.dark;
    if (d.view && typeof d.view === 'object') {
      out.view = { x:num(d.view.x), y:num(d.view.y), s:Math.min(20, Math.max(0.05, num(d.view.s, 1))) };
    }
    if (Array.isArray(d.strokes)) for (const st of d.strokes) {
      if (!st || typeof st !== 'object' || !Array.isArray(st.pts)) { out.dropped++; continue; }
      const pts = [];
      for (const q of st.pts) {
        if (!q || typeof q !== 'object' || !isFinite(q.x) || !isFinite(q.y)) continue;
        const o = { x:+q.x, y:+q.y }; if (typeof q.p === 'number' && isFinite(q.p)) o.p = q.p; pts.push(o);
      }
      if (!pts.length) { out.dropped++; continue; }
      const col = typeof st.color === 'string' && /^#[0-9a-f]{6}$/i.test(st.color) ? st.color.toLowerCase() : PALETTE[0].key;
      out.strokes.push({ color: col, width: Math.min(100, Math.max(0.5, num(st.width, 3))), pts });
    }
    if (Array.isArray(d.images)) for (const m of d.images) {
      // 外部 URL は受け付けない(読込だけで外部へ通信が発生し、PNG 書き出しも失敗するため)
      if (!m || typeof m !== 'object' || typeof m.src !== 'string' || !SAFE_SRC.test(m.src) || m.src.length > 20e6) { out.dropped++; continue; }
      const w = num(m.w), h = num(m.h); if (!(w > 0) || !(h > 0)) { out.dropped++; continue; }
      out.images.push({ src:m.src, x:num(m.x), y:num(m.y), w, h });
    }
    return out;
  }
  function applyData(d) {
    const v = sanitize(d);
    strokes = v.strokes; images = v.images;
    dark = v.dark; document.getElementById('white').checked = !dark; updateSwatches();
    view = v.view;
    selImg = null; cur = null; undoStack = []; redoStack = [];
  }
  function loadBoard(id) {
    let d = null; try { d = JSON.parse(localStorage.getItem(DATA(id)) || 'null'); } catch (e) {}
    curId = id; applyData(d); try { saveIndex(); } catch (e) {} renderBoardList(); redraw();
  }
  function switchBoard(id) { if (id === curId) return; if (!confirmUnsaved()) { renderBoardList(); return; } loadBoard(id); const b = boards.find(b => b.id===id); setStatus('ボード「' + (b ? b.name : '') + '」を開きました'); }
  function addBoard(name, data) {
    if (curId && !confirmUnsaved()) return null;
    const id = newId(); boards.push({ id, name });
    try { localStorage.setItem(DATA(id), JSON.stringify(Object.assign({ v:2, dark:true, view:{x:0,y:0,s:1}, strokes:[], images:[], t:Date.now() }, data || {}))); }
    catch (e) {
      if (!storageOK) { /* 保存できない環境でもメモリ上では使えるようにする */ loadBoard(id); setStatus(storageMsg(e)); return id; }
      boards.pop(); alert(isQuota(e) ? '保存容量が足りません。不要なボードを削除してください' : '保存に失敗しました: ' + (e && e.message || e)); return null;
    }
    loadBoard(id); return id;
  }
  // 他のタブが同じ保存領域に書き込んだときの処理
  window.addEventListener('storage', e => {
    if (!e.key) return;
    if (e.key === INDEX) {   // ボード一覧の変更を取り込む(current は自タブのまま)
      try { const idx = JSON.parse(e.newValue || 'null'); if (idx && Array.isArray(idx.boards)) { boards = idx.boards; if (!boards.some(b => b.id===curId)) { setStatus('このボードは別のタブで削除されました。残す場合は JSON 保存してください'); return; } renderBoardList(); } } catch (_) {}
      return;
    }
    if (curId && e.key === DATA(curId)) {
      if (saveTimer || saveFailed || cur) { setStatus('同じボードが別のタブでも編集されています。両方で編集すると後に保存した方が残ります'); return; }
      let d = null; try { d = JSON.parse(e.newValue || 'null'); } catch (_) {}
      if (d) { applyData(d); redraw(); setStatus('別のタブでの変更を反映しました(元に戻す履歴はリセット)'); }
    }
  });
  function defaultName() { let n = boards.length + 1; while (boards.some(b => b.name === 'ボード ' + n)) n++; return 'ボード ' + n; }
  function renderBoardList() {
    const sel = document.getElementById('boardsel'); sel.innerHTML = '';
    for (const b of boards) { const o = document.createElement('option'); o.value = b.id; o.textContent = b.name; if (b.id===curId) o.selected = true; sel.appendChild(o); }

      let name = (typeof d.name === 'string' && d.name.trim().slice(0, 100)) || f.name.replace(/\.json$/i, '').slice(0, 100);
      while (boards.some(b => b.name === name)) name += ' (2)';
      const id = addBoard(name, { dark: v.dark, view: v.view, strokes: v.strokes, images: v.images });
      if (id) setStatus('「' + name + '」を新しいボードとして読み込みました' + (v.dropped ? '(不正な要素 ' + v.dropped + ' 件を除外)' : ''));
    }).catch(() => alert('読み込めませんでした')).finally(() => { fi.value=''; });
  });
  document.getElementById('white').addEventListener('change', e => { dark=!e.target.checked; updateSwatches(); redraw(); autosave(); });

  // ---- 画像の貼り付け(Ctrl+V)/ ドロップ ----
  function addImageFromBlob(blob, sx, sy) {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        // 画面上 1:1(CSS px)で見える大きさ。画面より大きい場合は画面幅の 80% に収める
        let w = img.naturalWidth/dpr, h = img.naturalHeight/dpr;
        const maxW = 0.8*W/view.s, maxH = 0.8*H/view.s; w /= view.s; h /= view.s;
        const k = Math.min(1, maxW/w, maxH/h); w *= k; h *= k;
        const cpt = (sx!==undefined) ? toWorld(sx,sy) : toWorld(W/2, H/2);
        const m = { src: fr.result, x: cpt.x - w/2, y: cpt.y - h/2, w, h, img };
        images.push(m); selImg = m; pushOp({type:'img', image:m}); redraw();
        setStatus('画像を貼り付けました(移動ツールでドラッグして移動、四隅のハンドルで拡大縮小、Delete で削除)');
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(blob);
  }
  window.addEventListener('paste', e => {
    const items = e.clipboardData && e.clipboardData.items; if (!items) return;
    for (const it of items) if (it.type.startsWith('image/')) {
      e.preventDefault();
      const p = lastPtr && lastPtr.x>=0 && lastPtr.x<=W && lastPtr.y>=0 && lastPtr.y<=H ? lastPtr : null;
      addImageFromBlob(it.getAsFile(), p ? p.x : undefined, p ? p.y : undefined); return;
    }
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault();
    const f = [...(e.dataTransfer.files||[])].find(f => f.type.startsWith('image/')); if (!f) return;
    const r = c.getBoundingClientRect(); addImageFromBlob(f, e.clientX - r.left, e.clientY - r.top);
  });

  // ---- キーボード ----
  window.addEventListener('keydown', e => {
    const tag = e.target.tagName;
    if ((tag==='INPUT' && e.target.type!=='checkbox') || tag==='SELECT' || tag==='TEXTAREA') return;
    const mod = e.ctrlKey || e.metaKey;   // macOS の Cmd にも対応
    if (mod && !e.altKey && e.key.toLowerCase()==='z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && !e.altKey && e.key.toLowerCase()==='y') { e.preventDefault(); redo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;   // 他の修飾キー付きはブラウザに任せる(Ctrl+F 等)
    if (e.code==='Space') { e.preventDefault(); if (!spaceDown) { spaceDown=true; c.classList.add('pan'); curEl.className=''; } return; }
    if (e.key==='1') selectColor('#000000');
    if (e.key==='2') selectColor('#e8502a');
    if (e.key==='3') selectColor('#f0c020');
    if (e.key==='4') selectColor('#0050d0');
    if (e.key.toLowerCase()==='e') setTool('eraser');
    if (e.key.toLowerCase()==='h') setTool('hand');
    if (e.key==='0') { view={x:0,y:0,s:1}; redraw(); }
    if (e.key.toLowerCase()==='f') fit();
    if ((e.key==='Delete' || e.key==='Backspace') && selImg && images.includes(selImg)) {
      const idx = images.indexOf(selImg); images.splice(idx,1); pushOp({type:'imgdel', image:selImg, index:idx}); selImg=null; redraw();
    }
    if (e.key==='Escape') { selImg=null; redraw(); }
  });
  window.addEventListener('keyup', e => { if (e.code==='Space') { spaceDown=false; if (!panState) c.classList.remove('pan'); } });
  resize();
  try { restore(); } catch (e) { boards = []; curId = null; applyData(null); renderBoardList(); redraw(); setStatus('保存データを読めませんでした。JSON 保存で退避してください'); }
  resize();
})();
</script>
